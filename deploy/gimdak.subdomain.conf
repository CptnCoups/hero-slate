# SWAG proxy conf: gimdak.iamhome.cloud -> hero-slate container, behind Authentik.
# Lives at /mnt/user/appdata/swag/nginx/proxy-confs/gimdak.subdomain.conf on the tower.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gimdak.iamhome.cloud;
    include /config/nginx/ssl.conf;
    include /config/nginx/authentik-server.conf;

    # The sheet is at /gimdak; send the bare domain there.
    location = / {
        return 302 /gimdak;
    }

    location / {
        include /config/nginx/authentik-location.conf;
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 127.0.0.1;
        set $upstream_port 3500;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
