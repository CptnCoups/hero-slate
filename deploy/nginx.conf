# Serves the static build inside the hero-slate container on Unraid.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Character files change without a rebuild of the app shell.
    location /characters/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed bundles never change.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback for clean paths such as /gimdak.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
