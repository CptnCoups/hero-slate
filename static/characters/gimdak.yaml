name: Gimdak Steelward
level: 7
class: Paladin
color: sun

# Each stat lists its skills (bonuses from D&D Beyond) under a ▾ on the sheet.
# Saves include Aura of Protection (+3, the Charisma bonus, on every save);
# Wisdom and Charisma also add proficiency (+3).
abilities:
  - label: Strength
    value: 20
    save: "+8"
    skills:
      - { name: Athletics, bonus: 8, proficient: true }
  - label: Dexterity
    value: 14
    save: "+5"
    skills:
      - { name: Acrobatics, bonus: 2 }
      - { name: Sleight of Hand, bonus: 2 }
      - { name: Stealth, bonus: 2 }
  - label: Constitution
    value: 14
    save: "+5"
  - label: Intelligence
    value: 11
    save: "+3"
    skills:
      - { name: Arcana, bonus: 0 }
      - { name: History, bonus: 0 }
      - { name: Investigation, bonus: 0 }
      - { name: Nature, bonus: 0 }
      - { name: Religion, bonus: 0 }
  - label: Wisdom
    value: 10
    save: "+6"
    skills:
      - { name: Medicine, bonus: 3, proficient: true }
      - { name: Animal Handling, bonus: 0 }
      - { name: Insight, bonus: 0 }
      - { name: Perception, bonus: 0 }
      - { name: Survival, bonus: 0 }
  - label: Charisma
    value: 16
    save: "+9"
    skills:
      - { name: Intimidation, bonus: 6, proficient: true }
      - { name: Persuasion, bonus: 6, proficient: true }
      - { name: Deception, bonus: 3 }
      - { name: Performance, bonus: 3 }
combat:
  - label: Armor Class
    value: 20
  - label: Speed
    value: 30
  - label: Initiative
    value: "+2"

# Senses from D&D Beyond: Dragonborn darkvision, and passive scores
# (10 + the skill bonus, as D&D Beyond shows them).
senses:
  - label: Darkvision
    value: "60 ft"
  - label: Passive Perception
    value: 10
  - label: Passive Insight
    value: 10
  - label: Passive Investigation
    value: 10

hitPoints:
  max: 66
  # A Hit Die on a short rest: Paladin d10 + Constitution bonus (+2).
  hitDie: "d10+2"

pools:
  - id: holy-power
    label: Holy Power
    color: sun
    max: 2
    # Channel Divinity: one use back on a short rest, all on a long rest
    # (2024 Paladin rule text on D&D Beyond).
    shortRestRegain: 1
  - id: fire-breath
    label: Fire Breath
    color: fire
    max: 3
  - id: dragon-wings
    label: Dragon Wings
    color: ocean
    max: 1
  - id: earth-shaker
    label: Earth Shaker
    color: forest
    max: 3
  - id: slots-1
    label: Spell Slots (1st)
    color: berry
    max: 4
  - id: slots-2
    label: Spell Slots (2nd)
    color: berry
    max: 3
  - id: lay-on-hands
    label: Lay On Hands
    color: sun
    max: 35
  - id: divine-smite
    label: Free Divine Smite
    color: sun
    max: 1
  - id: find-steed
    label: Free Find Steed
    color: neutral
    max: 1
  - id: hit-dice
    label: Hit Dice
    color: ocean
    max: 7

sections:
  - title: Action
    color: fire
    rows:
      - title: ⚔️ Attack
        body: "When you take the Attack action you attack twice (Extra Attack). Tap to pick: Warhammer, Javelin, Fire Breath, or The Earth Shaker."
        breakout: attacks
      - title: ✨ Cast a Spell
        body: "Tap to pick a spell — spell attack [[d20+6]], save [[DC 14]]"
        breakout: spells

  - title: Bonus Action
    color: sun
    rows:
      - title: 💡 Pick One
        body: "You only get one bonus action a turn, so choose wisely!"
      - title: 🛡️ Champion Challenge
        body: "Uses 1 Holy Power. Shout a challenge: enemies within 30 feet make a [[DC 14]] Wisdom save or can't move more than 30 feet away from you. Your best first move!"
        pool: holy-power
      - title: 🌊 Turn the Tide
        body: "Uses 1 Holy Power. Friends within 30 feet who can hear you and have half their hit points or less each heal [[1d6+3]]."
        pool: holy-power
      - title: 🙌 Lay On Hands
        body: "Touch a creature (even yourself) and heal any amount from your 35-point pool, or spend 5 points to cure poison."
      - title: 🐉 Dragon Wings
        body: "Sprout dragon wings and fly for 10 minutes! Once per long rest."
        pool: dragon-wings

  - title: Reaction
    color: ocean
    rows:
      - title: 💡 Pick One
        body: "You get one reaction each round — save it for the right moment."
      - title: 👁️ Sentinel
        body: "An enemy next to you attacks someone else? Swing at them for free, and they stop in their tracks."
      - title: 🤺 Interception
        body: "A friend next to you gets hit? Block it with your shield and they take [[1d10+3]] less damage."
      - title: 💛 Divine Allegiance
        body: "A friend within 5 feet takes damage? Take the hit yourself instead, and nothing can lower it. Tip: save it for a hit that would knock a friend down."

  - title: Game Plan
    color: neutral
    rows:
      - title: 🧲 Stay Close
        body: "Your holy aura helps friends standing near you shrug off dragon breath, fireballs, and scary spells. Keeping two or three friends close is your most important job — even more than swinging your hammer. Don't chase enemies far away."
      - title: 🎯 First Turn
        body: "Use Champion Challenge on a fast enemy, or one running at your weaker friends. It keeps them stuck near you."
      - title: 💡 Which Bonus Action?
        body: "Challenge first. Turn the Tide when two or more friends are badly hurt. Lay On Hands to heal. Smite only after you've already hit and the fight is going okay."
      - title: 🤔 Which Reaction?
        body: "Sentinel when an enemy attacks a tough friend. Interception when they attack your wizard or another weak friend. Divine Allegiance only to stop a friend from falling down."
      - title: 🧱 Be the Wall
        body: "Stand next to your weakest friend. Challenge the enemies, Sentinel stops anyone who tries to get past, and Interception blocks what gets through. You're not the big hitter — you're the wall."
      - title: 🌅 Before the Fight
        body: "Cast Aid after every long rest. Cast Warding Bond on a strong friend who is fully healed, and end it if you start getting badly hurt."
      - title: ⚠️ Be Careful
        body: "Warding Bond and Divine Allegiance both make you take hits for friends. Use only one of them per fight, and heal yourself with Lay On Hands."

  - title: Strengths
    color: forest
    rows:
      - title: 💪 Mighty Muscles
        body: climbing, jumping & shoving (Athletics), [[+8]] bonus
      - title: 👑 Royal Voice
        body: talking people around, nicely or scarily (Persuasion, Intimidation), [[+6]] bonus
      - title: 🩹 Field Medic
        body: patching up wounds (Medicine), [[+3]] bonus

# Spells for the Cast a Spell breakout. `level` picks which slot pools
# (slots-N, N >= level) each spell can use; `free` names a pool of free casts.
spells:
  - title: 🙏 Bless
    level: 1
    url: https://www.dndbeyond.com/spells/2618933-bless
    body: "Action, 30 feet: up to three friends add [[1d4]] to their attack rolls and saving throws for 1 minute. Concentration. Your best spell!"
  - title: ⚡ Divine Smite
    level: 1
    url: https://www.dndbeyond.com/spells/2618833-divine-smite
    free: divine-smite
    body: "Bonus action, right after you hit with a melee attack: add [[2d8]] radiant damage (1d8 more against fiends and undead, and 1d8 more with a 2nd-level slot)."
  - title: 💥 Thunderous Smite
    level: 1
    url: https://www.dndbeyond.com/spells/2619182-thunderous-smite
    body: "Bonus action, right after you hit with a melee attack: add [[2d6]] thunder damage, and they make a [[DC 14]] Strength save or get pushed 10 feet and knocked prone."
  - title: 💖 Cure Wounds
    level: 1
    url: https://www.dndbeyond.com/spells/2619079-cure-wounds
    body: "Action, touch: a creature heals [[2d8+3]] hit points (2d8 more with a 2nd-level slot)."
  - title: 🗣️ Command
    level: 1
    url: https://www.dndbeyond.com/spells/2618985-command
    body: "Action, 60 feet: give a one-word order (Approach, Drop, Flee, Grovel, or Halt). They make a [[DC 14]] Wisdom save or obey on their next turn."
  - title: ⚔️ Compelled Duel
    level: 1
    url: https://www.dndbeyond.com/spells/2618990-compelled-duel
    body: "Bonus action, 30 feet: one enemy makes a [[DC 14]] Wisdom save or has disadvantage attacking anyone but you and can't move more than 30 feet from you. Concentration, 1 minute. It ends if you attack someone else or a friend hurts that enemy."
  - title: 🌟 Aid
    level: 2
    url: https://www.dndbeyond.com/spells/2618845-aid
    body: "Action, 30 feet: up to three friends get 5 more maximum and current hit points for 8 hours. No concentration, so cast it after a long rest!"
  - title: ✨ Lesser Restoration
    level: 2
    url: https://www.dndbeyond.com/spells/2619016-lesser-restoration
    body: "Bonus action, touch: end Blinded, Deafened, Paralyzed, or Poisoned on one creature."
  - title: 🤝 Warding Bond
    level: 2
    url: https://www.dndbeyond.com/spells/2619203-warding-bond
    body: "Action, touch, 1 hour: a willing friend gets +1 to AC and saves and takes only half damage, but every time they take damage, you take the same. Ends if you drop to 0 hit points or get more than 60 feet apart."
  - title: ⚖️ Zone of Truth
    level: 2
    url: https://www.dndbeyond.com/spells/2619221-zone-of-truth
    body: "Action, 60 feet, 10 minutes: a 15-foot circle where anyone inside makes a [[DC 14]] Charisma save or can't tell a lie."
  - title: 🐴 Find Steed
    level: 2
    url: https://www.dndbeyond.com/spells/2618879-find-steed
    free: find-steed
    body: "Action, 30 feet: summon your Fey steed, a big loyal mount (AC 12, 25 hit points, speed 60). It attacks with Otherworldly Slam: [[d20+6]] to hit, [[1d8+2]] psychic damage. Once per long rest it can Fey Step: teleport you both up to 60 feet. When a spell heals you, it heals the same amount if it is next to you."

# Attacks for the Attack breakout. Numbers come from D&D Beyond; `pool`
# spends a use from that pool. The Earth Shaker DC follows the feat's own
# formula: 8 + proficiency (3) + Strength bonus (5).
attacks:
  - title: 🔨 Warhammer
    body: "Smash! [[d20+8]] to hit, [[1d8+5]] damage. Push: knock a hit enemy (Large or smaller) back 10 feet."
  - title: 🎯 Javelin
    body: "Throw it up to 30 feet (up to 120 with disadvantage): [[d20+8]] to hit, [[1d6+5]] damage. Slow: a hit enemy moves 10 feet slower until your next turn. You carry 6."
  - title: 🔥 Fire Breath
    pool: fire-breath
    body: "Replaces one of your attacks. Breathe a 15-foot cone or a 30-foot line of fire: everyone in it makes a [[DC 13]] Dexterity save or takes [[2d10]] fire damage (half if they pass)."
  - title: 🌋 The Earth Shaker
    pool: earth-shaker
    body: "Slam your weapon into the ground. Everyone within 10 feet makes a [[DC 16]] Strength save or falls down, and the ground there becomes hard to walk on."
